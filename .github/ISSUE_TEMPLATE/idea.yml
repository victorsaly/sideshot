name: An idea
description: Something SideShot could picture, mark or say that it does not yet.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you were trying to show
      description: The pull request, the page, and what a reviewer should have seen.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: An option, a default, a sentence in SKILL.md. Whatever shape you have in mind.
