name: Something went wrong
description: SideShot stopped, pictured the wrong thing, or wrote something it should not have.
labels: [bug]
body:
  - type: textarea
    id: asked
    attributes:
      label: What you ran, or asked your agent
      description: The command line, or your words to the agent, and the `.sideshot.json` if you have one. Leave out logins and tokens.
      render: text
    validations:
      required: true
  - type: textarea
    id: said
    attributes:
      label: What it said, or did
      description: SideShot's own lines, and a picture if it pictured the wrong thing.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SideShot version
      description: In `.claude-plugin/plugin.json`, or `/plugin` in Claude Code.
      placeholder: 0.5.4
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where it ran
      description: The agent (Claude Code, Codex, Cursor, by hand), your system, Node and Playwright versions.
      placeholder: Claude Code on macOS 15, Node 22.20, Playwright 1.64
