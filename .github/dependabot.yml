version: 2
updates:
  # The pinned actions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # The development tools: Playwright, ESLint, TypeScript.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node's types follow the Node SideShot supports (engines in package.json), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev:
        patterns: ['*']
